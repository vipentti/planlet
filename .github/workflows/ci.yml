name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - run: git diff --check
      # Linux only: a Windows checkout normalizes line endings and would report
      # unrelated diffs.
      - name: generated skills match canonical sources
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          node dist/planlet.mjs update --tools all
          git diff --exit-code
      - name: changelog sections are structurally release-ready
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/assert-changelog-release-ready.mjs
